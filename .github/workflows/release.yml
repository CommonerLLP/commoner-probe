name: Release

on:
  push:
    tags:
      - "v*"

# Publishing to PyPI cannot be undone — a version number is spent the moment it
# is accepted. Everything that can fail must therefore fail BEFORE the publish
# step, in this workflow, on the exact commit being tagged.
#
# Until 2026-08-01 nothing did: this file went straight from checkout to
# `pypa/gh-action-pypi-publish` with no tests, no lint, and no check that the
# tag matched the version in pyproject.toml. Pushing `v0.13.0` at a tree
# reading `version = "0.12.1"` would have published 0.12.1 under a v0.13.0 tag,
# silently. `make verify-release` catches some of this, but only afterwards and
# only when a human remembers to run it.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the version being built
        run: |
          python - <<'PY'
          import os, re, sys, pathlib
          ref = os.environ["GITHUB_REF_NAME"]          # e.g. v0.13.0
          tagged = ref[1:] if ref.startswith("v") else ref
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE)
          if not match:
              sys.exit("no `version = \"...\"` line in pyproject.toml")
          declared = match.group(1)
          if declared != tagged:
              sys.exit(
                  f"tag {ref} would publish {declared}. The tag and "
                  "pyproject.toml must agree, or the release is mislabelled on "
                  "PyPI forever. Fix the version, commit, retag."
              )
          print(f"tag {ref} matches pyproject.toml {declared}")
          PY
      - name: Install
        run: python -m pip install -e ".[pdf,http,dev]"
      - name: Lint
        run: python -m ruff check commoner_probe tests scripts
      - name: Test
        run: pytest -q

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
